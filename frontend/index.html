<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f2">
  <meta name="description" content="Discover great local finds or list something for your community on AdPost.">
  <title>AdPost — Good finds, close by</title>
  <link rel="icon" type="image/svg+xml" href="./assets/logo-icon.svg">
  <link rel="apple-touch-icon" href="./assets/logo-badge.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700;750;800&family=Manrope:wght@500;600;650;700;750;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div class="topline"></div>
  <header class="header">
    <nav class="nav shell" aria-label="Main navigation">
      <a class="brand" href="#home" aria-label="AdPost home">
        <span class="brand-mark">
          <img src="./assets/logo-icon.svg" alt="AdPost Logo" width="34" height="34" class="brand-logo-img">
        </span>
        <span class="brand-name">ad<span class="brand-name-accent">post</span></span>
      </a>
      <div class="navlinks">
        <button data-page="home">Home</button>
        <button data-page="browse">Browse products</button>
        <button data-page="about">About</button>
      </div>
      <div class="nav-actions">
        <button class="saved-link" data-page="auth" id="auth-nav-btn">Sign in</button>
        <button class="saved-link" data-page="dashboard">My products</button>
        <button class="saved-link" data-page="saved">Saved <span id="saved-count"></span></button>
        <button class="button button-small" data-page="post">+ &nbsp; Post a product</button>
        <button class="mobile-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
      </div>
      <div class="mobile-nav">
        <button data-page="home">Home</button>
        <button data-page="browse">Browse products</button>
        <button data-page="post">Post a product</button>
        <button data-page="dashboard">My products</button>
        <button data-page="saved">Saved products</button>
        <button data-page="about">About AdPost</button>
        <button data-page="auth" id="mobile-auth-btn">Sign in</button>
      </div>
    </nav>
  </header>
  <main id="app" class="shell"></main>
  <footer class="footer">
    <div class="shell footer-inner">
      <div class="footer-brand">
        <img src="./assets/logo-icon.svg" alt="AdPost Logo" width="22" height="22" class="footer-logo-img">
        <span><strong>AdPost</strong> &nbsp;Good finds, close by.</span>
      </div>
      <span>Made for your corner of Nigeria. &nbsp;© <span id="year"></span> AdPost.</span>
    </div>
  </footer>
  <div class="toast" role="status" aria-live="polite"></div>
  
  <script type="module" src="./src/app.js"></script>
</body>
</html>
