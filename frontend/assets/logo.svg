<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" fill="none">
  <defs>
    <linearGradient id="ap-l-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E2C"/>
      <stop offset="50%" stop-color="#F08A1B"/>
      <stop offset="100%" stop-color="#DE4A20"/>
    </linearGradient>
    <linearGradient id="ap-l-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="ap-l-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F08A1B"/>
      <stop offset="100%" stop-color="#DE4A20"/>
    </linearGradient>
    <filter id="ap-l-shadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#F08A1B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(2, 2)">
    <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#ap-l-bg)" filter="url(#ap-l-shadow)"/>
    <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#ap-l-shine)"/>
    <rect x="0.5" y="0.5" width="47" height="47" rx="13.5" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>

    <!-- Scaled Ribbon 'A' with Basket Apex -->
    <g transform="translate(0, 0)">
      <!-- Basket Handles -->
      <path d="M21 11.5 C21 8.5 22.5 7 24 7 C25.5 7 27 8.5 27 11.5" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <!-- Basket Rim -->
      <rect x="17.5" y="11.5" width="13" height="2" rx="1" fill="#FFFFFF"/>
      <!-- Basket Body -->
      <path d="M18.8 13.5 L20 18 C20.2 18.8 20.8 19.3 21.6 19.3 L26.4 19.3 C27.2 19.3 27.8 18.8 28 18 L29.2 13.5 Z" fill="#FFFFFF"/>
      <!-- Basket Slats -->
      <rect x="21" y="14.3" width="1.1" height="3.6" rx="0.5" fill="url(#ap-l-bg)"/>
      <rect x="23.45" y="14.3" width="1.1" height="3.6" rx="0.5" fill="url(#ap-l-bg)"/>
      <rect x="25.9" y="14.3" width="1.1" height="3.6" rx="0.5" fill="url(#ap-l-bg)"/>

      <!-- Left Leg -->
      <path d="M21.5 20.2 L10.5 39.5 C10.2 40.1 10.6 40.8 11.3 40.8 L15.5 40.8 C16 40.8 16.4 40.5 16.7 40 L22 30 L24 26.5 L21.5 20.2 Z" fill="#FFFFFF" fill-opacity="0.95"/>
      <!-- Right Leg -->
      <path d="M26.5 20.2 L24 26.5 L26 30 L31.3 40 C31.6 40.5 32 40.8 32.5 40.8 L36.7 40.8 C37.4 40.8 37.8 40.1 37.5 39.5 L26.5 20.2 Z" fill="#FFFFFF" fill-opacity="0.95"/>
      <!-- Dynamic Ribbon Crossbar -->
      <path d="M14 33.5 C17.5 30.8 21.3 30.8 25 32.8 C28.7 34.8 32.5 34.8 36 32 L36 34.2 C32.5 37 28.7 37 25 35 C21.3 33 17.5 33 14 35.8 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Typography: 'adpost' -->
  <g transform="translate(62, 34)">
    <text font-family="'Manrope', 'DM Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-1.2">
      <tspan fill="#171A17">ad</tspan><tspan fill="url(#ap-l-text)">post</tspan>
    </text>
    <circle cx="106" cy="-4" r="3.5" fill="url(#ap-l-bg)"/>
  </g>

  <!-- Subtext: 'BUY &amp; SELL MARKETPLACE' -->
  <g transform="translate(63, 46)">
    <text font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#717D74" letter-spacing="1.5">
      BUY &amp; SELL MARKETPLACE
    </text>
  </g>
</svg>
