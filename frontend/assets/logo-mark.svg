<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ap-m-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E2C"/>
      <stop offset="50%" stop-color="#F08A1B"/>
      <stop offset="100%" stop-color="#DE4A20"/>
    </linearGradient>
    <filter id="ap-m-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#F08A1B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#ap-m-shadow)">
    <!-- Basket Handles forming the apex of letter 'A' -->
    <path d="M50 12 C54.5 12 57.5 14.5 60 18.5 L73 40 C73.8 41.2 73.2 42.8 71.8 43 L65 43.5 C63.8 43.5 62.7 42.8 62.1 41.8 L50 21 L37.9 41.8 C37.3 42.8 36.2 43.5 35 43.5 L28.2 43 C26.8 42.8 26.2 41.2 27 40 L40 18.5 C42.5 14.5 45.5 12 50 12 Z" fill="url(#ap-m-grad)"/>

    <!-- Basket Rim -->
    <rect x="18" y="43" width="64" height="7.5" rx="3.75" fill="url(#ap-m-grad)"/>

    <!-- Basket Body -->
    <path d="M22 53.5 L28 80.5 C29 84.5 32.5 87.5 36.5 87.5 L63.5 87.5 C67.5 87.5 71 84.5 72 80.5 L78 53.5 Z" fill="url(#ap-m-grad)"/>

    <!-- Ventilation Slots (negative white slots) -->
    <rect x="34.5" y="59" width="5.5" height="20" rx="2.75" fill="#FFFFFF"/>
    <rect x="47.25" y="59" width="5.5" height="20" rx="2.75" fill="#FFFFFF"/>
    <rect x="60" y="59" width="5.5" height="20" rx="2.75" fill="#FFFFFF"/>

    <!-- Center Sparkle / Verified Star -->
    <circle cx="50" cy="32" r="3.2" fill="url(#ap-m-grad)"/>
  </g>
</svg>
