<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ap-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E2C"/>
      <stop offset="50%" stop-color="#F08A1B"/>
      <stop offset="100%" stop-color="#DE4A20"/>
    </linearGradient>
    
    <!-- Top Glass Highlight -->
    <linearGradient id="ap-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Basket Fill Gradient -->
    <linearGradient id="ap-basket-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF2E5"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="ap-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#6E1E07" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Squircle App Badge -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#ap-bg-grad)"/>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#ap-shine)"/>
  <rect x="4.5" y="4.5" width="91" height="91" rx="23.5" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>

  <!-- E-commerce Shopping Basket + 'A' Emblem -->
  <g filter="url(#ap-shadow)">
    <!-- Basket Handles forming the apex of letter 'A' -->
    <path d="M50 16 C53.5 16 55.5 18 57.5 21.5 L70 41 C70.6 42 70.2 43.2 69 43.5 L63.5 44 C62.5 44 61.6 43.4 61.1 42.5 L50 24 L38.9 42.5 C38.4 43.4 37.5 44 36.5 44 L31 43.5 C29.8 43.2 29.4 42 30 41 L42.5 21.5 C44.5 18 46.5 16 50 16 Z" fill="url(#ap-basket-fill)"/>

    <!-- Basket Top Rim (Also acts as the crossbar shelf) -->
    <rect x="21" y="43" width="58" height="6.5" rx="3.25" fill="#FFFFFF"/>

    <!-- Basket Body (Tapered shopping basket with rounded base) -->
    <path d="M25 52 L30.5 76.5 C31.3 80 34.2 82.5 37.8 82.5 L62.2 82.5 C65.8 82.5 68.7 80 69.5 76.5 L75 52 Z" fill="url(#ap-basket-fill)"/>

    <!-- Shopping Basket Vertical Ventilation Slots (cutouts) -->
    <rect x="36" y="57" width="5" height="18" rx="2.5" fill="url(#ap-bg-grad)"/>
    <rect x="47.5" y="57" width="5" height="18" rx="2.5" fill="url(#ap-bg-grad)"/>
    <rect x="59" y="57" width="5" height="18" rx="2.5" fill="url(#ap-bg-grad)"/>

    <!-- Small Sparkle / Verified Deal Star at Basket Apex -->
    <circle cx="50" cy="34" r="2.8" fill="#FFFFFF"/>
  </g>
</svg>
