<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ap-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E2C"/>
      <stop offset="50%" stop-color="#F08A1B"/>
      <stop offset="100%" stop-color="#DE4A20"/>
    </linearGradient>
    
    <!-- Top Glass Highlight -->
    <linearGradient id="ap-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Ribbon Fill Gradient -->
    <linearGradient id="ap-ribbon-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF2E5"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="ap-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#6E1E07" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle App Badge -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#ap-bg-grad)"/>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#ap-shine)"/>
  <rect x="4.5" y="4.5" width="91" height="91" rx="23.5" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Logo Mark: Ribbon 'A' with Shopping Basket Apex -->
  <g filter="url(#ap-shadow)">
    <!-- Basket Handles -->
    <path d="M43 21 C43 15.5 46.5 13 50 13 C53.5 13 57 15.5 57 21" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" fill="none"/>

    <!-- Basket Rim -->
    <rect x="36" y="21" width="28" height="4.2" rx="2.1" fill="#FFFFFF"/>

    <!-- Basket Body -->
    <path d="M38.5 25.2 L41.2 34.5 C41.6 36 43 37 44.5 37 L55.5 37 C57 37 58.4 36 58.8 34.5 L61.5 25.2 Z" fill="#FFFFFF"/>
    
    <!-- Basket Ventilation Slats -->
    <rect x="43.5" y="27" width="2.2" height="7.2" rx="1.1" fill="url(#ap-bg-grad)"/>
    <rect x="48.9" y="27" width="2.2" height="7.2" rx="1.1" fill="url(#ap-bg-grad)"/>
    <rect x="54.3" y="27" width="2.2" height="7.2" rx="1.1" fill="url(#ap-bg-grad)"/>

    <!-- Left Leg of Ribbon 'A' -->
    <path d="M44.5 39 L23.5 79 C22.9 80.2 23.8 81.5 25.1 81.5 L33.2 81.5 C34.2 81.5 35 80.9 35.5 80 L46 59.5 L49 53 L44.5 39 Z" fill="url(#ap-ribbon-fill)"/>

    <!-- Right Leg of Ribbon 'A' -->
    <path d="M55.5 39 L51 53 L54 59.5 L64.5 80 C65 80.9 65.8 81.5 66.8 81.5 L74.9 81.5 C76.2 81.5 77.1 80.2 76.5 79 L55.5 39 Z" fill="url(#ap-ribbon-fill)"/>

    <!-- Dynamic Flowing Ribbon Crossbar -->
    <path d="M30 67 C36.5 61.5 44 61.5 51 65.5 C58 69.5 65.5 69.5 72 64 L72 68 C65.5 73.5 58 73.5 51 69.5 C44 65.5 36.5 65.5 30 71 Z" fill="#FFFFFF"/>
  </g>
</svg>
